name: cron_job

on:
  # 每天 UTC 00:17 运行一次（= 北京时间 08:17），GitHub cron 只用 UTC
  schedule:
    - cron: "17 0 * * *"
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

jobs:
  build:
    # 上游原文件写的是 ubuntu-20.04，该镜像已被 GitHub 下线，必须改
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORK_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate RSS summaries
        run: |
          python main.py
          ls -al docs/
        env:
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          CUSTOM_MODEL: ${{ secrets.CUSTOM_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          U_NAME: ${{ secrets.U_NAME }}

      - name: Commit and push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git status -s
          git add docs/*
          git add README*
          # 当天无新增文章时 commit 会失败，加兜底避免整个 workflow 报错
          git commit -m "Auto Build at `date +"%Y-%m-%d %H:%M"`" || echo "No changes to commit"
          git push
