# Frontend dangerous-API drift gate (T-014).
# Purpose: turn CI red when new code writes unsanitized data into the DOM.
# Exception: assignment of DOMPurify.sanitize() output is the sanctioned form.
rules:
- id: no-raw-innerhtml-assignment
  patterns:
  - pattern: $EL.innerHTML = $HTML
  - pattern-not: $EL.innerHTML = DOMPurify.sanitize(...)
  message: Direct innerHTML assignment without DOMPurify.sanitize(). Rendering
    unsanitized pipeline/feed data this way is an XSS sink (see T-004 V-01).
    Sanitize first, or use textContent / framework binding.
  languages:
  - js
  - ts
  severity: ERROR
  metadata:
    category: security
    technology:
    - javascript
    - typescript
