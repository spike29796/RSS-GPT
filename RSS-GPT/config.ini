# 源的来龙去脉、下线记录、参数调整历史都在同目录的 SOURCES.md。
# 这里只放生效的配置。要恢复某个下线的源，去 SOURCES.md 复制那节的参数块。

[cfg]
base="docs/"
language="zh"
summary_length="50"
categories="模型发布,行业动态,政策法规,开源项目,产品应用"
