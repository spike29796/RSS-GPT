# ============================================================
# T-041 2026-09-14：扩充源类型
#
# 依据：大卫用意图标注跑出 84 条数据 → 「能马上用」0 条。
# 根因不是他不用，是【源全是新闻媒体】—— 新闻产出"发生了什么"，
# 天然只能被标"只需知道/与我无关"，永远拿不到"能马上用"。
#
# 所以这一批加的是【能直接动手】的类型：
#   代码（GitHub Trending）/ 论文（arXiv）/ 实操讨论（HN, Lobsters,
#   r/LocalLLaMA）/ 技术博客（Lilian Weng, The Gradient）
#
# ⚠️ 每源限量（ithome 教训：它 120 条淹没了所有其他源，让人以为"整站都是垃圾"）
#    max_items=3, backfill_items=10 —— 保持各源量级均衡
# ============================================================

