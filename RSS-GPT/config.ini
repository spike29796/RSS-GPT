[cfg]
base="docs/"
language="zh"
summary_length="50"
categories="模型发布,行业动态,政策法规,开源项目,产品应用"
default_category="行业动态"
# 2026-09-25：25 -> 40 分钟。原来 25 分钟只够处理约 130 条，
# 英文源积压（arxiv-ro 995 条、hackernews 213 条）永远补不完。
# workflow 的 job 上限同步由 45 提到 90 分钟留出余量。
backfill_max_minutes="40"
feed_max_bytes="52428800"

# T-044 2026-09-14：OpenAI News 下线
# 依据：大卫判定「1000 条感觉都没意义，直接不收录」。
# 实测数据（1000 条 / 年份分布）：
#   2026 年 407 条 ｜ 2025 年 332 ｜ 2024 年 164 ｜ 2023 年 66 ｜ 2022 年 31
#   → 不是"全是老数据"，而是两个问题叠加：
#     ① 量：一个源攒了 1000 条（别的源 20-60 条），把页面全淹了
#        —— 与 IT之家 同一个病：单源压倒全部
#     ② 性质：内容多为公司宣传（合作/政策/人事/发布），非技术实操
#        —— 所以即便日期新，也拿不到「能马上用」
# 根因：它的 backfill_days="3650"（10 年）→ 历史条目一路累积到 1000 上限
# ⚠️ 代价已知：一手发布（GPT-6 Astra / Agents API 等）以后不再进站。
# 想恢复：把下面整段 # 去掉，并把 backfill_days 改成 "30"（只取近期）。
# [source002]
# name="openai-news"
# url="https://openai.com/news/rss.xml"
# max_items="3"
# categories="..."
# default_category="Company"
# backfill_days="30"
# backfill_items="80"

