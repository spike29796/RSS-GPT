backfill_items = "10"

# NVIDIA Blog（官方 WordPress RSS；多标签开放词表，首个 tag 作分类）
[source010]
name = "nvidia-blog"
url = "https://blogs.nvidia.com/feed/"
max_items = "3"
default_category = "AI"
backfill_days = "30"
backfill_items = "10"
