[cfg]
base = "docs/"
language = "zh"
summary_length = "50"
# 允许的文章分类，逗号分隔；模型输出不在列表内时兜底为 default_category
# 单个源可用 [sourceNNN] 下的 categories 键覆盖此全局列表
categories = "模型发布,行业动态,政策法规,开源项目,产品应用"
default_category = "行业动态"
# 回填+新条目摘要的总时间预算（分钟），0=不限。防 Actions 6 小时超时杀进程
# 导致整轮摘要丢失：预算耗尽即停止 LLM 调用，正常落盘提交，下轮继续。
backfill_max_minutes = "25"
# 单个 feed 解压后的最大字节数，超限即中止该源抓取、记警告日志并跳过
# （防 gzip 炸弹 OOM，修复 V-03；计数的是解压后字节，不是线上字节）
feed_max_bytes = "52428800"

# OpenAI News：分类直接复用 feed 自带的官方 <category> 标签（20 个官方词汇，
# 见下方 categories），LLM 只写一句话中文导读
[source002]
name = "openai-news"
url = "https://openai.com/news/rss.xml"
max_items = "3"
categories = "Company,Research,Product,Global Affairs,Story,Safety & Alignment,Safety,OpenAI Academy,Publication,Security,Engineering,API,AI Adoption,Release,Startup,ChatGPT,Guides,Applied AI,Webinar,OpenAI on OpenAI"
default_category = "Company"
# 回填覆盖全部档案（≈10年窗口）；10 条/天稳步推进（配合 backfill_max_minutes
# 软预算与 TPD 限额，别再开 300/天 加速档——会撞 Actions 超时全丢）
backfill_days = "3650"
backfill_items = "10"

# Claude Blog（claude.com/blog，采集器源，无 RSS；Webflow SSR 卡片解析）
# 分类复用卡片自带官方 tag，LLM 只写导读+译题
[source003]
name = "claude-blog"
url = "https://claude.com/blog"
collector = "claude_blog"
max_items = "3"
categories = "Product announcements,Enterprise AI,Claude Code,Agents,eBook"
default_category = "Product announcements"
backfill_days = "30"
backfill_items = "10"

# Google Blog（The Keyword，官方 RSS；多标签开放词表，首个 tag 作分类）
[source004]
name = "google-blog"
url = "https://blog.google/rss/"
max_items = "3"
default_category = "AI"
backfill_days = "30"
backfill_items = "10"

# Kimi Blog（kimi.com/blog，采集器解析 Next.js SSR 卡片；无官方 tag，全局五类）
[source006]
name = "kimi-blog"
url = "https://www.kimi.com/blog/"
collector = "kimi_blog"
max_items = "3"
default_category = "行业动态"
backfill_days = "90"
backfill_items = "10"

# Microsoft Blog（官方 WordPress RSS；ignore_tags 滤掉固定噪声标签）
[source007]
name = "microsoft-blog"
url = "https://blogs.microsoft.com/feed/"
max_items = "3"
ignore_tags = "Featured,The Official Microsoft Blog"
default_category = "AI"
backfill_days = "30"
backfill_items = "10"

# Apple Newsroom（官方 feed，Atom 格式；标签 PRESS RELEASE/UPDATE）
[source008]
name = "apple-newsroom"
url = "https://www.apple.com/newsroom/rss-feed.rss"
max_items = "3"
categories = "PRESS RELEASE,UPDATE"
default_category = "PRESS RELEASE"
backfill_days = "60"
backfill_items = "10"

# SpaceX Updates（采集器直读公开 JSON API；Cloudflare 封锁 CN/HK，
# Actions 美国 IP 正常，本地仅播种。无官方 tag，源级分类集）
[source009]
name = "spacex-updates"
url = "https://content.spacex.com/api/spacex-website/updates"
collector = "spacex_updates"
max_items = "3"
categories = "星舰计划,火箭与发动机,星链,航天任务,公司动态"
default_category = "公司动态"
backfill_days = "365"
backfill_items = "10"

# NVIDIA Blog（官方 WordPress RSS；多标签开放词表，首个 tag 作分类）
[source010]
name = "nvidia-blog"
url = "https://blogs.nvidia.com/feed/"
max_items = "3"
default_category = "AI"
backfill_days = "30"
backfill_items = "10"
