[cfg]
base = "docs/"
language = "zh"
summary_length = "50"
# 允许的文章分类，逗号分隔；模型输出不在列表内时兜底为 default_category
# 单个源可用 [sourceNNN] 下的 categories 键覆盖此全局列表
categories = "模型发布,行业动态,政策法规,开源项目,产品应用"
default_category = "行业动态"
# 回填+新条目摘要的总时间预算（分钟），0=不限。防 Actions 6 小时超时杀进程
# 导致整轮摘要丢失：预算耗尽即停止 LLM 调用，正常落盘提交，下轮继续。
backfill_max_minutes = "25"
# 单个 feed 解压后的最大字节数，超限即中止该源抓取、记警告日志并跳过
# （防 gzip 炸弹 OOM，修复 V-03；计数的是解压后字节，不是线上字节）
feed_max_bytes = "52428800"

# OpenAI News：分类直接复用 feed 自带的官方 <category> 标签（20 个官方词汇，
# 见下方 categories），LLM 只写一句话中文导读
[source002]
name = "openai-news"
url = "https://openai.com/news/rss.xml"
max_items = "3"
categories = "Company,Research,Product,Global Affairs,Story,Safety & Alignment,Safety,OpenAI Academy,Publication,Security,Engineering,API,AI Adoption,Release,Startup,ChatGPT,Guides,Applied AI,Webinar,OpenAI on OpenAI"
default_category = "Company"
# 回填覆盖全部档案（≈10年窗口）；10 条/天稳步推进（配合 backfill_max_minutes
# 软预算与 TPD 限额，别再开 300/天 加速档——会撞 Actions 超时全丢）
backfill_days = "3650"
backfill_items = "10"

# 量子位（中文 AI 媒体：模型发布/行业动态/融资行情）
[source003]
name = "qbitai"
url = "https://www.qbitai.com/feed"
max_items = "5"
default_category = "行业动态"
backfill_days = "30"
backfill_items = "10"

# Simon Willison（AI 技术博客：新技术/开源项目/深度实践）
[source004]
name = "simonwillison"
url = "https://simonwillison.net/atom/everything/"
max_items = "5"
default_category = "行业动态"
backfill_days = "30"
backfill_items = "10"

# 极客公园（中文科技/AI 行业动态）
[source006]
name = "geekpark"
url = "https://www.geekpark.net/rss"
max_items = "5"
default_category = "行业动态"
backfill_days = "30"
backfill_items = "10"

# IT之家（中文科技新闻，AI 板块活跃）
[source007]
name = "ithome"
url = "https://www.ithome.com/rss/"
max_items = "5"
default_category = "行业动态"
backfill_days = "30"
backfill_items = "10"

# Product Hunt（新产品发布，看技术产品趋势）
[source008]
name = "producthunt"
url = "https://www.producthunt.com/feed"
max_items = "5"
