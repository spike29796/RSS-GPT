[bilibili]
# B站官方公开 API 直采（包工头 2026-08-12 拍板，弃 RSSHub）；
# api_base 可切换——断源复演与测试隔离的落点
api_base = "https://api.bilibili.com"
# 14 个 up 主 uid，抄自共享区 D:\vibe-coding\factory-shared\uid.txt
uids = "15741969,4848323,686127,14145636,280780745,604710494,517986781,3546390319860710,3493134979827825,385085361,271442527,385670211,96081167,21849780"
# 每 uid 每轮新增上限（首跑 ≤5，每日增量 ≤5；总量防爆炸，对齐 openai 千余条教训）
# 2026-09-25：每轮上限 5 → 30（原来 5 条把"更新一多"的情况全漏掉）
per_uid_per_run_max = "30"
# 每 uid 请求间隔（秒），防风控
# 间隔 1 → 2 秒，降低 412 风控概率
request_interval_sec = "2"

# 2026-09-25 新增：每页条数 / 翻页数 / 风控重试
# 原来写死 ps=5 且只拉第 1 页 —— 每个 UP 最多 5 条，更新一多就永久漏
# B站 space API 的 ps 上限为 50，代码里会再夹紧一次
page_size = "30"
pages = "2"
# 412（B站风控页）是临时限频，退避重试常能恢复
retry_max = "2"
retry_wait_sec = "6"
