[cfg]
base = "docs/"
language = "zh"
keyword_length = "5"
summary_length = "50"
# 允许的文章分类，逗号分隔；模型输出不在列表内时兜底为 default_category
# 单个源可用 [sourceNNN] 下的 categories 键覆盖此全局列表
categories = "模型发布,行业动态,政策法规,开源项目,产品应用"
default_category = "行业动态"

# 量子位（替代机器之心：机器之心官方 RSS 已下线，详见 README 踩坑记录）
[source001]
name = "qbitai"
url = "https://www.qbitai.com/feed"
max_items = "3"
# 回填：每轮额外为最近 7 天内未摘要的条目补摘要，最多 5 条
backfill_days = "7"
backfill_items = "5"

[source002]
name = "openai-news"
url = "https://openai.com/news/rss.xml"
max_items = "3"
# 回填只限最近 7 天；1000+ 历史档案（超窗）永不回填
backfill_days = "7"
backfill_items = "5"

[source003]
name = "ithome"
url = "https://www.ithome.com/rss/"
max_items = "3"
# 回填：每轮额外为最近 3 天内未摘要的条目补摘要，最多 10 条
backfill_days = "3"
backfill_items = "10"

# Awwwards Site of the Day（采集器源，非 RSS）
# collector 键指向 collectors.py 的 COLLECTORS 注册表；url 作为采集目标页
# 条目凭 标题+Tags 走 LLM 分类与一句话导读（独立分类集，不用全局五类）
[source004]
name = "awwwards-sotd"
url = "https://www.awwwards.com/websites/sites_of_the_day/"
collector = "awwwards_sotd"
max_items = "5"
categories = "榜单发布,优秀工作室,技术展示,视觉风格,行业资讯"
default_category = "行业资讯"
backfill_days = "30"
backfill_items = "10"
