[cfg]
base = "docs/"
language = "zh"
keyword_length = "5"
summary_length = "50"
# 允许的文章分类，逗号分隔；模型输出不在列表内时兜底为 default_category
# 单个源可用 [sourceNNN] 下的 categories 键覆盖此全局列表
categories = "模型发布,行业动态,政策法规,开源项目,产品应用"
default_category = "行业动态"

# OpenAI News：分类直接复用 feed 自带的官方 <category> 标签（20 个官方词汇，
# 见下方 categories），LLM 只写一句话中文导读
[source002]
name = "openai-news"
url = "https://openai.com/news/rss.xml"
max_items = "3"
categories = "Company,Research,Product,Global Affairs,Story,Safety & Alignment,Safety,OpenAI Academy,Publication,Security,Engineering,API,AI Adoption,Release,Startup,ChatGPT,Guides,Applied AI,Webinar,OpenAI on OpenAI"
default_category = "Company"
# 回填只限最近 7 天；1000+ 历史档案（超窗）永不回填
backfill_days = "7"
backfill_items = "5"
