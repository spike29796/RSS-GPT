[cfg]
base = "docs/"
language = "zh"
keyword_length = "5"
summary_length = "200"
# 允许的文章分类，逗号分隔；模型输出不在列表内时兜底为 default_category
# 单个源可用 [sourceNNN] 下的 categories 键覆盖此全局列表
categories = "模型发布,行业动态,政策法规,开源项目,产品应用"
default_category = "行业动态"

# 量子位（替代机器之心：机器之心官方 RSS 已下线，详见 README 踩坑记录）
[source001]
name = "qbitai"
url = "https://www.qbitai.com/feed"
max_items = "3"

[source002]
name = "openai-news"
url = "https://openai.com/news/rss.xml"
max_items = "3"

[source003]
name = "ithome"
url = "https://www.ithome.com/rss/"
max_items = "3"
