<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; frame-src https://player.bilibili.com; connect-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenAI News 聚合</title>
    <script>
      // Set the theme before first paint: saved choice wins, otherwise follow
      // the system preference. The header toggle overrides and persists.
      document.documentElement.dataset.theme =
        localStorage.getItem('theme') ||
        (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
    </script>
      <!-- PWA：可装到手机桌面 -->
    <link rel="manifest" href="/RSS-GPT/manifest.json" />
    <link rel="apple-touch-icon" href="/RSS-GPT/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="News 聚合" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
      <script>
      // 安全上下文（https / localhost）才注册 service worker
      (function () {
        var secure = location.protocol === 'https:' || location.hostname === 'localhost' ||
          location.hostname === '127.0.0.1';
        if ('serviceWorker' in navigator && secure) {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/RSS-GPT/sw.js', { scope: '/RSS-GPT/' }).catch(function () {});
          });
        }
      })();
    </script>
      <!-- PWA 安装入口 -->
    <style>
      #pwa-install-btn{position:fixed;right:16px;bottom:16px;z-index:9999;display:none;
        align-items:center;gap:6px;padding:10px 16px;border:0;border-radius:22px;
        background:#0b0f14;color:#fff;font-size:14px;line-height:1;cursor:pointer;
        box-shadow:0 4px 14px rgba(0,0,0,.35);font-family:inherit}
      #pwa-install-btn:hover{background:#1b2530}
      #pwa-tip{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:9999;
        display:none;max-width:90vw;padding:12px 16px;border-radius:12px;background:#0b0f14;color:#fff;
        font-size:13px;line-height:1.7;box-shadow:0 4px 14px rgba(0,0,0,.4);font-family:inherit;text-align:left}
      #pwa-tip b{color:#ff8c42}
      #pwa-tip .x{position:absolute;top:4px;right:10px;cursor:pointer;opacity:.6}
    </style>
    <button id="pwa-install-btn" type="button">装到桌面</button>
    <div id="pwa-tip"></div>
    <script>
      (function () {
        var btn = document.getElementById('pwa-install-btn');
        var tip = document.getElementById('pwa-tip');
        var deferred = null;

        var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
          window.navigator.standalone === true;
        if (standalone) { return; }

        function say(html, ms) {
          tip.innerHTML = '<span class="x" onclick="this.parentNode.style.display=\'none\'">✕</span>' + html;
          tip.style.display = 'block';
          clearTimeout(say._t);
          say._t = setTimeout(function () { tip.style.display = 'none'; }, ms || 20000);
        }

        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          deferred = e;
          btn.style.display = 'inline-flex';
        });

        btn.addEventListener('click', function () {
          if (deferred && typeof deferred.prompt === 'function') {
            btn.textContent = '处理中…';
            try { deferred.prompt(); } catch (err) { /* 落到下面兜底 */ }
            var settled = false;
            if (deferred.userChoice && deferred.userChoice.then) {
              deferred.userChoice.then(function (r) {
                settled = true;
                if (r && r.outcome === 'accepted') {
                  btn.style.display = 'none';
                } else {
                  manual();
                }
                deferred = null;
              }).catch(function () { if (!settled) { manual(); } });
            }
            // Chrome 有时既不弹框也不回调，等 1.2 秒没动静就给手动步骤
            setTimeout(function () {
              if (!settled) { manual(); }
            }, 1200);
          } else {
            manual();
          }
        });

        function manual() {
          btn.textContent = '装到桌面';
          say('没弹出安装框？手动装：<br>' +
              '① 点右上角 <b>⋮</b> 菜单<br>' +
              '② 选「<b>安装应用</b>」或「<b>添加到主屏幕</b>」' +
              '<br><span style="opacity:.7">iPhone 请在 Safari 里点底部分享按钮 → 添加到主屏幕</span>');
        }

        window.addEventListener('appinstalled', function () {
          btn.style.display = 'none';
          tip.style.display = 'none';
        });

        // iOS：不支持安装事件，直接常驻文字引导
        var ua = navigator.userAgent || '';
        var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var isSafari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS/.test(ua);
        var inApp = /MicroMessenger|QQ\/|Weibo|Alipay|Quark|UCBrowser/i.test(ua);
        if (isIOS && isSafari && !inApp) {
          say('在 <b>Safari</b> 里点底部的「分享」按钮 → 「添加到主屏幕」', 15000);
        }
      })();
    </script>
  </body>
</html>
