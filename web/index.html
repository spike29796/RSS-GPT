<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; frame-src https://player.bilibili.com; connect-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenAI News 聚合</title>
    <script>
      // Set the theme before first paint: saved choice wins, otherwise follow
      // the system preference. The header toggle overrides and persists.
      document.documentElement.dataset.theme =
        localStorage.getItem('theme') ||
        (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
    </script>
      <!-- PWA：可装到手机桌面 -->
    <link rel="manifest" href="/RSS-GPT/manifest.json" />
    <link rel="apple-touch-icon" href="/RSS-GPT/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="News 聚合" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
      <script>
      // 安全上下文（https / localhost）才注册 service worker
      (function () {
        var secure = location.protocol === 'https:' || location.hostname === 'localhost' ||
          location.hostname === '127.0.0.1';
        if ('serviceWorker' in navigator && secure) {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/RSS-GPT/sw.js', { scope: '/RSS-GPT/' }).catch(function () {});
          });
        }
      })();
    </script>
      <!-- PWA 安装入口（点了必有反馈，不依赖浏览器接口） -->
    <style>
      #pwa-install-btn{position:fixed;right:16px;bottom:16px;z-index:9999;display:none;
        align-items:center;gap:6px;padding:11px 17px;border:0;border-radius:22px;
        background:#0b0f14;color:#fff;font-size:14px;line-height:1;cursor:pointer;
        box-shadow:0 4px 14px rgba(0,0,0,.35);font-family:inherit}
      #pwa-install-btn:hover{background:#1b2530}
      #pwa-tip{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:9999;
        display:none;max-width:92vw;padding:14px 18px;border-radius:14px;background:#0b0f14;color:#fff;
        font-size:13.5px;line-height:1.85;box-shadow:0 6px 20px rgba(0,0,0,.45);font-family:inherit;
        text-align:left;box-sizing:border-box}
      #pwa-tip b{color:#ff8c42}
      #pwa-tip ol{margin:6px 0 0;padding-left:20px}
      #pwa-tip .x{position:absolute;top:6px;right:12px;cursor:pointer;opacity:.55;font-size:15px}
      #pwa-tip:before{content:"安装到手机桌面";display:block;font-weight:700;margin-bottom:6px;
        padding-right:24px}
    </style>
    <button id="pwa-install-btn" type="button">装到桌面</button>
    <div id="pwa-tip"></div>
    <script>
      (function () {
        var btn = document.getElementById('pwa-install-btn');
        var tip = document.getElementById('pwa-tip');
        var deferred = null;
        var ua = navigator.userAgent || '';
        var isIOS = /iPad|iPhone|iPod/.test(ua) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var isSafari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS/.test(ua);
        var inApp = /MicroMessenger|QQ\/|Weibo|Alipay/i.test(ua);
        var quark = /Quark/i.test(ua);
        var immersive = /immersive/i.test(ua);

        var standalone = (window.matchMedia &&
          window.matchMedia('(display-mode: standalone)').matches) ||
          window.navigator.standalone === true;
        if (standalone) { return; }

        function say(html, ms) {
          tip.innerHTML = '<span class="x" onclick="this.parentNode.style.display=\'none\'">✕</span>' + html;
          tip.style.display = 'block';
          clearTimeout(say._t);
          say._t = setTimeout(function () { tip.style.display = 'none'; }, ms || 30000);
        }

        // 能拿到安装事件就亮按钮（能装的时候才显示）
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          deferred = e;
          btn.style.display = 'inline-flex';
        });

        // 不在应用内、也不是 iOS Safari 时，也给个按钮——但点了一定有话说
        if (!inApp && !(isIOS && isSafari)) {
          btn.style.display = 'inline-flex';
        }

        function manualSteps() {
          var u = navigator.userAgent || '';
          if (/Huawei|HONOR/i.test(u)) {
            return '① 菜单 <b>⋮</b> → <b>「添加到桌面」</b>';
          }
          if (/MIUI|Xiaomi|Redmi|HeyTap|OPPO|vivo|OnePlus|realme/i.test(u)) {
            return '① 菜单 <b>⋮</b> → <b>「添加到桌面」</b>（自带的浏览器都支持）';
          }
          return '① 用手机<b>自带浏览器</b>打开本页<br>' +
                 '② 菜单 <b>⋮</b> → <b>「添加到桌面」</b>';
        }

        btn.addEventListener('click', function () {
          // 先说话，再尝试——保证永远有反应
          if (deferred && typeof deferred.prompt === 'function') {
            say('已请求安装，请确认弹窗。<br><span style="opacity:.7">如果没弹出来，' +
                '就用手动方式：</span><ol><li>' + manualSteps().replace('① ', '') + '</li></ol>', 25000);
            try { deferred.prompt(); } catch (err) {}
            var settled = false;
            if (deferred.userChoice && deferred.userChoice.then) {
              deferred.userChoice.then(function (r) {
                settled = true;
                if (r && r.outcome === 'accepted') { tip.style.display = 'none'; btn.style.display = 'none'; }
                deferred = null;
              }).catch(function () {});
            }
          } else {
            say('<b>这个浏览器没有开放安装接口。</b><br>' +
                '（夸克、UC、部分第三方壳浏览器都这样，不是你的操作问题）<br>' +
                '<ol><li>' + manualSteps().replace('① ', '') + '</li>' +
                '<li>想用<b>全屏 + 离线</b>的真 App，装 <b>Edge</b> 打开本页再点「安装应用」</li></ol>', 30000);
          }
        });

        window.addEventListener('appinstalled', function () {
          btn.style.display = 'none';
          tip.style.display = 'none';
        });

        // iOS Safari：不支持安装事件，常驻文字引导
        if (isIOS && isSafari && !inApp) {
          say('点底部「<b>分享</b>」（方框加箭头）→ 「<b>添加到主屏幕</b>」', 20000);
        }
      })();
    </script>
  </body>
</html>
