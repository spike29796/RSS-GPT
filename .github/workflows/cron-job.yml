name: cron_job

on:
  # 2026-09-11：恢复云端定时（包工头定 A 方案）
  # 每天 00:00 UTC = 北京 08:00 跑一次
  schedule:
    - cron: '0 0 * * *'
  # 保留手动触发作一次性/排查用
  workflow_dispatch:

# T-013：同组并发互斥，撞车时取消在跑的旧 run，避免双 push 必败其一
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

# 2026-09-11：原 WORK_TOKEN PAT 已失效（checkout 报 "Input required and
# not supplied: token"），改用内置 GITHUB_TOKEN。
# 注意：GITHUB_TOKEN 的 push 不会触发下游 workflow，故末尾显式触发 pages_deploy，
# 因此这里要 actions: write。
permissions:
  contents: write
  actions: write

jobs:
  build:
    # 上游原文件写的是 ubuntu-20.04，该镜像已被 GitHub 下线，必须改
    runs-on: ubuntu-latest
    # 硬上限：main.py 内部有 backfill_max_minutes 软预算兜底，这里再防
    # 意外挂死（默认 6 小时会烧额度且什么都提交不了）
    # 2026-09-25：45 -> 90。main.py 的 backfill 软预算提到 40 分钟后，
    # 45 分钟硬上限会把它中途掐死（抓取+提交还要额外时间）。
    timeout-minutes: 90

    # monorepo 适配（T-001）：业务代码在 RSS-GPT/ 子目录，所有 run 步骤
    # 默认在 RSS-GPT/ 下执行；checkout 仍在仓库根，子目录里跑 git 命令
    # 会自动上溯到仓库根，git add docs/ 实际暂存的是 RSS-GPT/docs/
    defaults:
      run:
        working-directory: RSS-GPT

    steps:
      - name: Check out repository
        # T-013：pin 到 commit SHA 防 tag 被重指，行尾注释保留版本号便于人读
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # T-013：与 RSS-GPT/.python-version 拉齐到 3.12
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate RSS summaries
        run: |
          python main.py
          ls -al docs/
        env:
          # 2026-09-11：改用智谱 GLM（OpenAI 兼容端点）
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          CUSTOM_MODEL: ${{ secrets.CUSTOM_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          U_NAME: ${{ secrets.U_NAME }}

      - name: Collect bilibili feeds (T-025)
        # 零 LLM：本步骤不带任何 LLM env；脚本降级 exit 0，失败不拦 commit
        # （Commit 步骤本就 if: always()）。产出 docs/bilibili.jsonl|.log
        # 由下方 git add docs/ 天然覆盖，无需改 commit 步骤。
        run: python bilibili_collect.py

      - name: Commit and push
        # 即使 Generate 步骤失败/超时也提交：已落盘的部分进度不能丢
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git status -s
          # T-013：docs/ 改目录路径式 add（无变更也 exit 0）；
          # README* 保留 glob 但加 || true 兜底空匹配，步骤不炸
          git add docs/
          git add README* || true
          # 当天无新增文章时 commit 会失败，加兜底避免整个 workflow 报错
          git commit -m "Auto Build at `date +"%Y-%m-%d %H:%M"`" || echo "No changes to commit"
          # 2026-09-14：原来这里是 `git push ... || echo "push skipped"` ——
          # 踩过的坑：CI 跑到一半时有人往 main 推了代码，CI 结束时 push 变
          # non-fast-forward 被拒，而这个 `|| echo` 把失败【静默吞掉】，
          # 整轮抓取（2.3MB 数据）白跑且毫无提示（T-042 实测）。
          # 现在：先 rebase 到最新 main 再 push，且失败就让步骤红掉、不再吞错。
          git pull --rebase --autostash origin main
          # 2026-09-11：GITHUB_TOKEN 经 env 传入，不落盘、日志自动 mask
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main

      - name: Trigger pages deploy
        # GITHUB_TOKEN 的 push 不触发下游 workflow（GitHub 有意设计），
        # 故 push 后显式 dispatch 一次 pages_deploy，否则站点不更新。
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml || echo "pages dispatch skipped"
